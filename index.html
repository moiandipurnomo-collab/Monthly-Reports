<div class="c"><h2>Rekap Bulanan</h2>${table(['Metrik','Sep','Okt','Δ'],[['Stok Awal',t[0].a,t[1].a,ff],['Stok Akhir',t[0].e,t[1].e,ff],['Rata-rata Stok',t[0].avg,t[1].avg,ff],['COGS',t[0].c,t[1].c,ff],['Daily COGS',t[0].dc,t[1].dc,ff],['ITR (x)',t[0].itr,t[1].itr,x=>nf(x,2)],['DIO (÷ITR) hari',t[0].dio1,t[1].dio1,d1],['DIO (Daily COGS) hari',t[0].dio2,t[1].dio2,d1]].map(([l,a,b,g])=>`<tr><td>${l}</td><td>${g(a)}</td><td>${g(b)}</td><td>${dlt(a,b)}</td></tr>`).concat(`<tr><td>Waste Rate</td><td>${pc(w0)}</td><td>${pc(w1)}</td><td>${dpp(w0,w1,true)}</td></tr>`))}</div>
<div class="c"><h2>Detail ITR &amp; DIO per ${lab}</h2>${table([lab,...fl('S','Sep'),...fl('O','Okt'),'Δ DIO'],rows.map(({n,a,b})=>`<tr><td>${n}</td>${cl(a)}${cl(b)}<td>${dlt(a.dio2,b.dio2,true)}</td></tr>`))}</div>`;
const[cs,co]=col(),t12=tp(rows,12),bar=(id,f)=>chart(id,{type:'bar',data:{labels:t12.map(r=>r.n),datasets:[{label:'Sep',data:t12.map(r=>r.a[f]),backgroundColor:cs},{label:'Okt',data:t12.map(r=>r.b[f]),backgroundColor:co}]}});
bar('i1','dio2');bar('i2','itr');
}
const R={sup:supply,wst:waste,log:logi,inv:inv};
function render(){R[S.tab]()}
function fillPick(){const p=$('#pick');p.disabled=S.g==='M';p.innerHTML=S.g==='D'?Array.from({length:31},(_,i)=>`<option value="${i+1}">Tgl ${i+1} (Sep vs Okt)</option>`).join(''):S.g==='W'?[1,2,3,4,5].map(w=>`<option value="${w}">Minggu ${w} · Sep ${wrange(0,w)} | Okt ${wrange(1,w)}</option>`).join(''):'<option>Satu bulan penuh</option>';S.pick=1}
function fillSel(){const o=(a,l)=>`<option value="">${l}</option>`+a.map((x,i)=>`<option value="${i}">${x}</option>`).join('');$('#br').innerHTML=o(D.B,'Semua Branch');$('#pr').innerHTML=o(D.P,'Semua Product');WH=D.B.map(b=>b.startsWith('Warehouse'));const used=new Set(D.B.map((b,i)=>WH[i]?-1:D.BA[i]));$('#am').innerHTML='<option value="">Semua AM</option>'+D.AM.map((x,i)=>used.has(i)?`<option value="${i}">${x}</option>`:'').join('');$('#cat').innerHTML=o(D.CAT,'Semua Kategori');S.br=S.pr=S.am=S.cat=''}
function wire(){
$('#g').onchange=e=>{S.g=e.target.value;fillPick();render()};
$('#pick').onchange=e=>{S.pick=+e.target.value;render()};
$('#dim').onchange=e=>{S.dim=e.target.value;render()};
$('#br').onchange=e=>{S.br=e.target.value;render()};$('#am').onchange=e=>{S.am=e.target.value;render()};$('#cat').onchange=e=>{S.cat=e.target.value;render()};$('#pr').onchange=e=>{S.pr=e.target.value;render()};
$('#mode').onchange=e=>{S.mode=e.target.value;render()};
$('#rf').onclick=boot;
$('#tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;S.tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===e.target));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t));render()};fillPick()}
let wired=0;
async function boot(){const ld=$('#ld'),rf=$('#rf');ld.style.display='block';ld.textContent='Memuat data dari Google Sheets… (bisa beberapa detik)';rf.disabled=true;
try{const r=await loadData();D=r.d;$('#ts').textContent=r.msg;ld.style.display='none';fillSel();if(!wired){wire();wired=1}render()}
catch(e){ld.innerHTML='<b>Gagal memuat data.</b> '+e.message+'<br><span class="mu">Pastikan sheet dibagikan "Anyone with the link – Viewer" dan nama tab sheet tidak berubah.</span>'}
rf.disabled=false}
boot();
</script></body></html>
