<style>

<div style="display:flex;gap:8px"><button id="rf">↻ Refresh data</button><a class="btn" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/1pymfdzjA95Ec81-rGW-C8gypi-UWQsN7wz-mA2Yl3F4/edit?gid=73676847">Buka Google Sheets ↗</a></div></header>

<script>
let D;
const SID='1pymfdzjA95Ec81-rGW-C8gypi-UWQsN7wz-mA2Yl3F4',BASE=Date.UTC(2026,8,1)/864e5,MNm=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const gv=async n=>{const r=await fetch(`https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(n)}`);if(!r.ok)throw new Error(`${n}: HTTP ${r.status}`);const t=await r.text(),m=t.match(/setResponse\(([\s\S]*)\);?\s*$/);if(!m)throw new Error(`${n}: respons bukan data (cek izin berbagi sheet)`);const j=JSON.parse(m[1]);if(j.status==='error')throw new Error(`${n}: ${(j.errors||[{}])[0].message||'error'}`);return j.table.rows.map(r=>(r.c||[]).map(c=>c?c.v:null))};
const pdt=v=>{if(typeof v!=='string')return null;const m=v.match(/^Date\((\d+),(\d+),(\d+)/);return m?Date.UTC(+m[1],+m[2],+m[3])/864e5:null};
const num=v=>typeof v==='number'?v:(parseFloat(v)||0);
async function loadData(){
const names=['GD','GTR','GR','STF','CP','Waste','SO Awal','SO Akhir','LOG-DL','LOG-ET','DT','COGS'];
let X;try{X=Object.fromEntries(await Promise.all(names.map(async n=>[n,await gv(n)])))}catch(e){
 try{const r=await fetch('data.json');if(!r.ok)throw 0;return{d:await r.json(),msg:'⚠ Mode snapshot (data.json) — gagal terhubung ke Google Sheets: '+e.message}}catch(_){throw e}}
const B=new Map,P=new Map,id=(M,k)=>{let i=M.get(k);if(i==null){i=M.size;M.set(k,i)}return i};
const T=(rows,c,dx,f,vf)=>{const m=new Map;for(const r of rows){if(f&&!f(r))continue;const d=pdt(r[c.d]);if(d==null)continue;const di=dx(d-BASE);if(di==null)continue;const b=id(B,String(r[c.b]).trim()),p=id(P,String(r[c.p]).trim()),k=di*1e6+b*1e3+p;let a=m.get(k);if(!a){a=[di,b,p,0,0];m.set(k,a)}a[3]+=num(r[c.q]);a[4]+=vf?vf(r):num(r[c.v])}return[...m.values()].map(a=>[a[0],a[1],a[2],Math.round(a[3]*1e3)/1e3,Math.round(a[4])])};
const dd=x=>x>=0&&x<=60?x:null,so=mp=>x=>mp[x]??null;
const gd=(c)=>({d:1,b:5,p:7,q:9,v:13}),cg={d:1,b:5,p:8,q:10,v:14},co=(b)=>({d:1,b,p:8,q:10,v:14});
const GDr=X['GD'].filter(r=>r[3]==='Transfer Request'&&String(r[4]).startsWith('Warehouse')),GRr=X['GR'].filter(r=>r[3]==='Goods Delivery');
const d={};
d.GD=T(GDr,{d:1,b:5,p:7,q:9,v:13},dd);d.GR=T(GRr,cg,dd);d.GRa=T(X['GR'],cg,dd);
d.STFo=T(X['STF'],co(4),dd);d.STFi=T(X['STF'],co(5),dd);
d.CP=T(X['CP'],{d:1,b:3,p:6,q:14,v:15},dd);
d.W=T(X['Waste'],{d:1,b:2,p:7,q:9},dd,null,r=>num(r[9])*num(r[10]));
const sc={d:1,b:2,p:3,q:7},sv=r=>num(r[7])*num(r[9]);
d.SOa=T(X['SO Awal'],sc,so({'-1':0,29:1}),null,sv);d.SOe=T(X['SO Akhir'],sc,so({29:0,60:1}),null,sv);
const gk=new Map,gp=new Map,ad=(M,k,q,v)=>{const a=M.get(k)||[0,0];a[0]+=q;a[1]+=v;M.set(k,a)};
for(const r of X['GD']){ad(gk,r[2]+'|'+r[7],num(r[9]),num(r[13]));ad(gp,r[7],num(r[9]),num(r[13]))}
const sn=new Set,GT=[];for(const r of X['GTR']){if(!String(r[2]).startsWith('Warehouse'))continue;const k=r[0]+'|'+r[4];if(sn.has(k))continue;sn.add(k);const a=gk.get(k),p=gp.get(r[4]),u=a&&a[0]>0?a[1]/a[0]:p&&p[0]>0?p[1]/p[0]:0,q=num(r[6]);GT.push([r[1],r[3],r[4],q,q*u])}
d.GTR=T(GT,{d:0,b:1,p:2,q:3,v:4},dd);
d.B=[...B.keys()];d.P=[...P.keys()];
d.COGS=X['COGS'].filter(r=>r[0]==='September'||r[0]==='Oktober').map(r=>[r[0]==='September'?0:1,String(r[1]).trim(),num(r[2]),num(r[8]),num(r[11])]);
const veh=v=>{const s=String(v).toLowerCase();return s.includes('van')?'Van':s.includes('engkel')?'Engkel Box':s.includes('pickup')?'Small Pickup':s.includes('box')?'Small Box':s.includes('xl')?'Car XL':'Car'};
const st=new Map;for(const r of X['DT']){const k=String(r[0]);if(!/^\d+$/.test(k))continue;let on=0,late=0;for(let i=15;i<25;i++){const s=String(r[i]||'').trim().toLowerCase();if(s==='on time')on++;else if(s==='terlambat'||s==='late')late++}st.set(k,[on,late])}
d.DL=[];for(const r of X['LOG-DL']){if(!/^\d+$/.test(String(r[1])))continue;const bl=String(r[3]||'').trim().toLowerCase();let m=/^sep/.test(bl)?0:/^(okt|oct)/.test(bl)?1:null;if(m==null){const t=pdt(r[4]);if(t==null)continue;const q=new Date(t*864e5);if(q.getUTCFullYear()!==2026||![8,9].includes(q.getUTCMonth()))continue;m=q.getUTCMonth()-8}const s=st.get(String(r[1]))||[0,0];d.DL.push([m,String(r[0]||'').replace(' (lama)','').trim(),veh(r[2]),num(r[11]),s[0],s[1]])}
d.ET=[];for(const r of X['LOG-ET']){const t=pdt(r[1]);if(t==null)continue;const m=new Date(t*864e5);d.ET.push([MNm[m.getUTCMonth()]+' '+m.getUTCFullYear(),String(r[3]),num(r[4]),num(r[6])])}
const n=new Date();return{d,msg:'Live dari Google Sheets · diperbarui '+n.toLocaleString('id-ID')}}

const $=s=>document.querySelector(s),MN=['Sep','Okt'];
const S={g:'M',pick:1,dim:'b',br:'',pr:'',mode:'v',tab:'sup'};
const dom=d=>d<30?d+1:d-29,mo=d=>d<30?0:1,DIM=[30,31];
const inP=d=>{const x=dom(d);return S.g==='M'||(S.g==='D'?x===S.pick:Math.ceil(x/7)===S.pick)};
const flt=(b,p)=>(!S.br||b===+S.br)&&(!S.pr||p===+S.pr);
const nf=(x,d=0)=>x==null||isNaN(x)?'–':x.toLocaleString('id-ID',{maximumFractionDigits:d});
const fv=x=>{if(x==null||isNaN(x))return'–';const a=Math.abs(x);return a>=1e9?nf(x/1e9,2)+' M':a>=1e6?nf(x/1e6,1)+' jt':nf(x)};
const fm=x=>S.mode==='v'?fv(x):nf(x,1),pc=x=>x==null||isNaN(x)?'–':nf(x,1)+'%';
const chg=(a,b)=>a?(b-a)/Math.abs(a)*100:null;
const cls=(x,bad)=>x==null?'':((x>0)===bad?'up':'dn');
const dlt=(a,b,bad=false)=>{const c=chg(a,b);return`<span class="${cls(c,bad)}">${c==null?'–':(c>0?'▲ ':'▼ ')+nf(Math.abs(c),1)+'%'}</span>`};
const dpp=(a,b,bad=false)=>{if(a==null||b==null||isNaN(a)||isNaN(b))return'–';const c=b-a;return`<span class="${cls(c,bad)}">${c>0?'▲ ':'▼ '}${nf(Math.abs(c),2)} pp</span>`};
const ix=S=>S.mode==='v'?4:3;
function agg(T,gate,K){const r=new Map();for(const x of T){if(!gate(x)||!flt(x[1],x[2]))continue;const k=K(x);let a=r.get(k);if(!a){a=[0,0];r.set(k,a)}a[0]+=x[3];a[1]+=x[4]}return r}
const gD=m=>x=>mo(x[0])===m&&inP(x[0]),gS=m=>x=>x[0]===m,gM=m=>x=>mo(x[0])===m;
const K=()=>S.dim==='b'?x=>x[1]:x=>x[2],NM=()=>S.dim==='b'?D.B:D.P;
const ch={};function chart(id,cfg){if(ch[id])ch[id].destroy();cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}},cfg.options||{});ch[id]=new Chart($('#'+id),cfg)}
const col=()=>{const s=getComputedStyle(document.documentElement);return[s.getPropertyValue('--s').trim()||'#6c8ebf',s.getPropertyValue('--o').trim()||'#e8833a']};
const per=()=>S.g==='M'?'Bulanan':S.g==='D'?`Harian · tgl ${S.pick}`:`Mingguan · minggu ${S.pick} (tgl ${S.pick*7-6}–${Math.min(S.pick*7,31)})`;
const kpi=(l,a,b,f,bad)=>`<div class="c k"><span class="mu">${l}</span><b>${f(b)}</b><div class="r"><span class="S">Sep: ${f(a)}</span>${dlt(a,b,bad)}</div></div>`;
const table=(h,rows)=>`<div class="sc"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const sum=(m,i)=>{let s=0;m.forEach(a=>s+=a[i]);return s};
const tp=(arr,n)=>arr.slice(0,n);

function supply(){
const k=K(),N=NM(),q=S.mode==='v'?1:0,fx=S.mode==='v'?fv:x=>nf(x,1),U=S.mode==='v'?'Value (Rp)':'Qty';
const R=[0,1].map(m=>({t:agg(D.GTR,gD(m),k),d:agg(D.GD,gD(m),k),r:agg(D.GR,gD(m),k)}));
const keys=[...new Set(R.flatMap(o=>[...o.t.keys(),...o.d.keys(),...o.r.keys()]))];
const g=(m,x)=>{const t=(R[m].t.get(x)||[0,0])[q],d=(R[m].d.get(x)||[0,0])[q],r=(R[m].r.get(x)||[0,0])[q];return{t,d,r,ssl:t?r/t*100:null,av:t?d/t*100:null}};
const rows=keys.map(x=>({x,a:g(0,x),b:g(1,x)})).sort((u,v)=>v.b.t-u.b.t);
const T=m=>{const t=sum(R[m].t,q),d=sum(R[m].d,q),r=sum(R[m].r,q);return{t,d,r,ssl:t?r/t*100:null,av:t?d/t*100:null}},t0=T(0),t1=T(1);
const sp=(c,n)=>[`<span class=${c}>${n} GTR</span>`,`<span class=${c}>${n} GD</span>`,`<span class=${c}>${n} GR</span>`,`<span class=${c}>${n} SSL</span>`,`<span class=${c}>${n} GD/GTR</span>`];
$('#sup').innerHTML=`<p class="note">Periode: <b>${per()}</b> · Satuan: <b>${U}</b>. Alur: Outlet membuat <b>GTR</b> (request) → Warehouse mengirim stok yang tersedia lewat <b>GD</b> → Outlet menerima <b>GR</b>. <b>SSL</b> = GR ÷ GTR (porsi request yang terpenuhi); <b>GD/GTR</b> = ketersediaan stok gudang. Value GTR memakai harga dari GD (referensi Transfer Number; bila belum ada GD, memakai harga rata-rata GD produk tsb).</p>
<div class="g">${kpi('Request (GTR)',t0.t,t1.t,fx)}${kpi('Supply Order (GD)',t0.d,t1.d,fx)}${kpi('Fulfill Order (GR)',t0.r,t1.r,fx)}${kpi('Supply Service Level (GR/GTR)',t0.ssl,t1.ssl,pc)}${kpi('Ketersediaan Gudang (GD/GTR)',t0.av,t1.av,pc)}</div>
<div class="g2"><div class="c"><h2>SSL — ${S.dim==='b'?'Top 12 Branch':'Top 12 SKU'} (by GTR Okt)</h2><div class="cv"><canvas id="c1"></canvas></div></div>
<div class="c"><h2>Tren harian SSL (tgl 1–31)</h2><div class="cv"><canvas id="c2"></canvas></div></div>
<div class="c"><h2>GTR vs GD vs GR (${U})</h2><div class="cv"><canvas id="c3"></canvas></div></div></div>
<div class="c"><h2>Tabel detail per ${S.dim==='b'?'Branch':'SKU'} (${U})</h2>${table([S.dim==='b'?'Branch':'SKU',...sp('S','Sep'),...sp('O','Okt'),'Δ SSL','Δ GTR'],rows.map(({x,a,b})=>`<tr><td>${N[x]}</td><td>${fx(a.t)}</td><td>${fx(a.d)}</td><td>${fx(a.r)}</td><td>${pc(a.ssl)}</td><td>${pc(a.av)}</td><td>${fx(b.t)}</td><td>${fx(b.d)}</td><td>${fx(b.r)}</td><td>${pc(b.ssl)}</td><td>${pc(b.av)}</td><td>${dpp(a.ssl,b.ssl)}</td><td>${dlt(a.t,b.t)}</td></tr>`))}</div>`;
const [cs,co]=col(),t12=tp(rows,12);
chart('c1',{type:'bar',data:{labels:t12.map(r=>N[r.x]),datasets:[{label:'Sep',data:t12.map(r=>r.a.ssl),backgroundColor:cs},{label:'Okt',data:t12.map(r=>r.b.ssl),backgroundColor:co}]},options:{scales:{y:{title:{display:true,text:'SSL %'}}}}});
const dd=[0,1].map(()=>Array.from({length:31},()=>[0,0]));
for(const[T2,i]of[[D.GTR,0],[D.GR,1]])for(const x of T2){if(!flt(x[1],x[2]))continue;dd[mo(x[0])][dom(x[0])-1][i]+=x[ix(S)]}
chart('c2',{type:'line',data:{labels:Array.from({length:31},(_,i)=>i+1),datasets:[0,1].map(m=>({label:MN[m],borderColor:[cs,co][m],tension:.25,data:dd[m].map(a=>a[0]?a[1]/a[0]*100:null)}))}});
chart('c3',{type:'bar',data:{labels:['GTR','GD','GR'],datasets:[0,1].map(m=>{const z=m?t1:t0;return{label:MN[m],backgroundColor:[cs,co][m],data:[z.t,z.d,z.r]}})}});
}
function wasteCalc(K2,gate){ // gate(m)->{tbl:gate}
const T={GRa:0,CP:1,STFo:2,STFi:3,W:4},res=new Map(),get=(k,m)=>{let r=res.get(k);if(!r){r=[0,1].map(()=>Array.from({length:6},()=>[0,0]));res.set(k,r)}return r[m]};
for(const m of[0,1]){for(const t in T)for(const x of D[t]){if(!gate.d(m)(x)||!flt(x[1],x[2]))continue;const a=get(K2(x),m)[T[t]];a[0]+=x[3];a[1]+=x[4]}
for(const x of D.SOa){if(x[0]!==m||!flt(x[1],x[2]))continue;const a=get(K2(x),m)[5];a[0]+=x[3];a[1]+=x[4]}}
return res}
function wasteRows(K2){const res=wasteCalc(K2,{d:gD}),i=ix(S),M=S.g==='M';
return[...res].map(([k,r])=>({k,m:r.map(z=>{const[gr,cp,so,si,w,s0]=z;const av=(M?s0[1]:0)+gr[1]+cp[1]+si[1]-so[1];return{z,av,rate:av>0?w[1]/av*100:null}})}))}
function waste(){
const k=K(),N=NM(),M=S.g==='M',i=ix(S),rows=wasteRows(k).sort((a,b)=>b.m[1].z[4][1]-a.m[1].z[4][1]);
const tot=m=>{const s=rows.reduce((a,r)=>{r.m[m].z.forEach((z,j)=>{a[j][0]+=z[0];a[j][1]+=z[1]});return a},Array.from({length:6},()=>[0,0]));const av=(M?s[5][1]:0)+s[0][1]+s[1][1]+s[3][1]-s[2][1];return{s,av,rate:av>0?s[4][1]/av*100:null}};
const t0=tot(0),t1=tot(1),hd=(c,l)=>`<span class="${c}">${l}</span>`;
const cell=(z,j)=>fm(z[j][i-3])+'';
const wk=m=>(z,j)=>fm(z[j][S.mode==='v'?1:0]);

const dimT=i=>{const A=by(0,i),B=by(1,i),ks=[...new Set([...A.keys(),...B.keys()])].sort((x,y)=>((B.get(y)||[0])[0])-((B.get(x)||[0])[0]));return{A,B,ks}};
const tb=(i,l)=>{const{A,B,ks}=dimT(i);return table([l,'<span class=S>Sep Biaya</span>','<span class=S>Sep Trip</span>','<span class=O>Okt Biaya</span>','<span class=O>Okt Trip</span>','Δ Biaya','Terlambat Sep','Terlambat Okt'],ks.map(k=>{const a=A.get(k)||[0,0,0,0],b=B.get(k)||[0,0,0,0];return`<tr><td>${k}</td><td>${nf(a[0])}</td><td>${a[1]}</td><td>${nf(b[0])}</td><td>${b[1]}</td><td>${dlt(a[0],b[0],true)}</td><td>${a[3]}</td><td>${b[3]}</td></tr>`}))};
$('#log').innerHTML=`<p class="note">Sumber: LOG-DL (Total Price INV), LOG-ET, dan sheet DT (status On Time/Terlambat per titik tujuan). Tidak terpengaruh filter tanggal (bulanan).</p>

${etNote}
<div class="g2"><div class="c"><h2>Biaya Pengiriman per Area</h2><div class="cv"><canvas id="l1"></canvas></div></div><div class="c"><h2>On Time vs Terlambat (jumlah tujuan)</h2><div class="cv"><canvas id="l2"></canvas></div></div>

const[cs,co]=col(),ar=dimT(1),vh=dimT(2),bar=(id,d)=>chart(id,{type:'bar',data:{labels:d.ks,datasets:[{label:'Sep',data:d.ks.map(k=>(d.A.get(k)||[0])[0]),backgroundColor:cs},{label:'Okt',data:d.ks.map(k=>(d.B.get(k)||[0])[0]),backgroundColor:co}]}});

chart('l2',{type:'bar',data:{labels:['Sep','Okt'],datasets:[{label:'On Time',data:[o0.a,o1.a],backgroundColor:'#2e9e6b'},{label:'Terlambat',data:[o0.b,o1.b],backgroundColor:'#d9534f'}]},options:{scales:{x:{stacked:true},y:{stacked:true}}}});

function inv(){

<div class="c"><h2>Detail DIO &amp; ITR per Branch</h2>${table(['Branch','<span class=S>Sep Stok Awal</span>','<span class=S>Sep Stok Akhir</span>','<span class=S>Sep Rata²</span>','<span class=S>Sep COGS</span>','<span class=S>Sep ITR</span>','<span class=S>Sep DIO</span>','<span class=O>Okt Stok Awal</span>','<span class=O>Okt Stok Akhir</span>','<span class=O>Okt Rata²</span>','<span class=O>Okt COGS</span>','<span class=O>Okt ITR</span>','<span class=O>Okt DIO</span>','Δ DIO'],rows.map(({n,a,b})=>`<tr><td>${n}</td><td>${ff(a.a)}</td><td>${ff(a.e)}</td><td>${ff(a.avg)}</td><td>${ff(a.c)}</td><td>${nf(a.itr,2)}</td><td>${nf(a.dio,1)}</td><td>${ff(b.a)}</td><td>${ff(b.e)}</td><td>${ff(b.avg)}</td><td>${ff(b.c)}</td><td>${nf(b.itr,2)}</td><td>${nf(b.dio,1)}</td><td>${dlt(a.dio,b.dio,true)}</td></tr>`))}</div>`;
const[cs,co]=col(),t12=tp(rows,12),bar=(id,f)=>chart(id,{type:'bar',data:{labels:t12.map(r=>r.n),datasets:[{label:'Sep',data:t12.map(r=>r.a[f]),backgroundColor:cs},{label:'Okt',data:t12.map(r=>r.b[f]),backgroundColor:co}]}});
